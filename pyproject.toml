[tool.poetry]
name = "agentic-cicd-engineer"
version = "0.1.0"
description = "A Self-Generating and Self-Healing Continuous Deployment System"
authors = ["Agentic CI/CD Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# LLM & Agent Framework
langgraph = "^0.2"
langchain = "^0.3"
langchain-openai = "^0.2"
langchain-anthropic = "^0.2"
langchain-google-genai = "^2.0"
langchain-community = "^0.3"
litellm = "^1.40"
groq = "^0.11"
google-generativeai = "^0.8"

# Embeddings & Vector Store
chromadb = "^0.5"
tiktoken = "^0.7"

# API & Web
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
websockets = "^13.0"
httpx = "^0.27"

# Data & Validation
pydantic = "^2.8"
pydantic-settings = "^2.4"

# Infrastructure
redis = "^5.0"
celery = {extras = ["redis"], version = "^5.4"}
sqlalchemy = "^2.0"
asyncpg = "^0.29"
alembic = "^1.13"

# Git & Repository
gitpython = "^3.1"
pygithub = "^2.3"

# Container & Cloud
docker = "^7.1"
boto3 = "^1.34"
kubernetes = "^30.1"

# YAML & Template
pyyaml = "^6.0"
jinja2 = "^3.1"
jsonschema = "^4.23"

# Observability
structlog = "^24.4"
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"

# CLI
typer = {extras = ["all"], version = "^0.12"}
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
ruff = "^0.5"
mypy = "^1.11"
pre-commit = "^3.7"
ipython = "^8.26"

[tool.poetry.scripts]
cicd-agent = "src.cli.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
